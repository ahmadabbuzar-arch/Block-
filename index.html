<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BlockTheory — Test Minecraft. Discover the impossible.</title>
<meta name="description" content="BlockTheory is a Minecraft creator experiment platform: myths, What If scenarios, challenges, secrets, mob battles, and addon discovery, turned into video-ready content.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="sidebar-scrim" id="sidebar-scrim"></div>

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-col">
    <header class="topbar">
      <button class="hamburger" id="hamburger-btn" aria-label="Open menu">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>

      <div class="header-search">
        <input type="text" id="global-search" placeholder="Search myths, experiments, mobs, addons..." aria-label="Search BlockTheory">
        <div class="search-results" id="search-results"></div>
      </div>

      <div class="header-spacer"></div>

      <span class="demo-badge" id="demo-badge">Demo Mode</span>

      <button class="avatar" id="header-avatar" data-nav="profile" aria-label="Profile">?</button>
    </header>

    <main id="view-root" class="view-root"></main>
  </div>
</div>

<nav class="bottom-nav" id="bottom-nav"></nav>

<div class="toast-host" id="toast-host"></div>
<div class="modal-root" id="modal-root"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics-compat.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/firebase.js"></script>
<script src="js/auth.js"></script>
<script src="js/firestore.js"></script>
<script src="js/storage.js"></script>
<script src="js/ai.js"></script>
<script src="js/addons.js"></script>
<script src="js/search.js"></script>
<script src="js/experiments.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>

<!--
  LIVE MODE — Firebase is configured (see js/firebase.js).
  The SDK scripts above load the compat build so the rest of the app's
  code (firebase.auth(), firebase.firestore(), firebase.storage()) works
  unchanged. Two things to finish on the Firebase console side:

    1. Authentication > Sign-in method > enable Google.
    2. Storage > "Get started" to provision the default bucket, then
       apply the rules from README.md section 5b so uploads are
       scoped to each user's own uid.

  Firestore collections (README.md section 5) and the /api/ai and
  /api/addons backend (functions/index.js, README.md section 6-7) still
  need to be created/deployed separately — until then, generateAI() and
  searchAddons() will throw "temporarily unavailable" instead of falling
  back to demo content, since BT_DEMO_MODE is now false.
-->
</body>
</html>
